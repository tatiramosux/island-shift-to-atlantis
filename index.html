<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- aberto pela Tela de Início do celular: sem as barras do navegador -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Island Shift" />
    <title>Island Shift to Atlantis</title>
    <!-- ícones: aba do navegador, Tela de Início do iPhone e do Android -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel+Decorative:wght@900&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #121212;
        --panel: #1a1a1a;
        --glass: rgba(26, 26, 26, 0.93);
        --card: #262626;
        --card2: #303030;
        --line: #3a3a3a;
        --btn: #2e2e2e;
        --btn-hover: #3c3c3c;
        --btn-on: #4a4a4a;
        --text: #f2f2f2;
        --muted: #a8a8a8;
        --accent: #ffe14d;
        --warn: #f5b324;
        --ok: #2f7d3a;
        --ok-line: #5bd16b;
        --error: #ff8b8b;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } /* sem o clarão azul do iOS ao tocar */
      /* sem a seleção azul de texto/tela ao segurar o dedo ou a caneta (S Pen): nada do jogo é selecionável, só campos de texto e as janelas de leitura */
      html, body, #app, #app * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
      #view, #view canvas { outline: none; }
      ::selection { background: transparent; color: inherit; }
      #app input, #app textarea, input, textarea { -webkit-user-select: text; user-select: text; }
      input::selection, textarea::selection { background: #2f8cff66; }
      #app .modal .card, #app .modal .card * { -webkit-user-select: text; user-select: text; }
      #app .modal .card button, #app .modal .card button * { -webkit-user-select: none; user-select: none; }
      .modal .card ::selection { background: #2f8cff66; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #view { position: absolute; inset: 0; transition: opacity 0.3s; }
      #view:not(.ready) { opacity: 0; } /* o cenário só aparece quando os navios já estão no lugar */
      /* alarme da reta final: as bordas da tela pulsam em vermelho no ritmo da música de clímax (1 compasso = 1,54 s) */
      .shout { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 55; pointer-events: none; font: 900 clamp(30px, 7vw, 64px) system-ui, sans-serif; color: #fff; letter-spacing: 2px; text-align: center; text-shadow: 0 0 18px #2fe0cf, 0 4px 0 #0b5c66, 0 0 40px #1fae9d; animation: shoutIn 2.6s ease-out forwards; }
      @keyframes shoutIn { 0% { opacity: 0; transform: translateX(-50%) scale(0.4); } 12% { opacity: 1; transform: translateX(-50%) scale(1.15) rotate(-2deg); } 25%, 80% { opacity: 1; transform: translateX(-50%) scale(1) rotate(1deg); } 100% { opacity: 0; transform: translateX(-50%) scale(1.1); } }
      #alarm { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 5;
        background: radial-gradient(ellipse at center, rgba(255, 40, 40, 0) 52%, rgba(255, 30, 30, 0.38) 82%, rgba(190, 0, 20, 0.7) 100%); }
      body.alarm #alarm { display: block; animation: alarmPulse 1.54s ease-in-out infinite; }
      @keyframes alarmPulse { 0%, 100% { opacity: 0.25; } 12% { opacity: 1; } 50% { opacity: 0.45; } 62% { opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { body.alarm #alarm { animation: none; opacity: 0.5; } }
      button {
        font: inherit; color: var(--text); background: var(--btn); border: 1px solid #555; border-radius: 8px; padding: 8px 12px; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      }
      button:hover:not(:disabled) { background: var(--btn-hover); }
      button.on { background: var(--btn-on); border-color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--ok); border-color: var(--ok-line); font-weight: 700; }
      button.primary:hover:not(:disabled) { background: #378f44; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      input { font: inherit; color: var(--text); background: #101010; border: 1px solid #555; border-radius: 8px; padding: 0 12px; height: 48px; width: 100%; }
      input:focus-visible { outline: 3px solid #fff; outline-offset: 1px; }
      svg.icon { flex: none; }
      * { scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid #0006; }
      .muted { color: var(--muted); font-size: 13px; }

      /* ---------- HUD do jogo: cartões de vidro por cima do tabuleiro ---------- */
      .hud { position: absolute; z-index: 3; }
      .hud-card { background: var(--glass); padding: 8px 10px; border: 1px solid #555; border-radius: 10px; }
      .hud-card h2 { margin: 0 0 7px; text-align: center; font-size: 13px; line-height: 1.2; letter-spacing: 0.04em; }
      .hud-tl { top: 10px; left: 10px; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: var(--glass); border: 1px solid #555; border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); }
      .hud-tl button { width: 44px; height: 44px; padding: 0; background: transparent; border-color: transparent; position: relative; }
      .hud-tl button:hover:not(:disabled) { background: var(--card2); }
      .hud-tl button + button::before { content: ''; position: absolute; left: 8px; right: 8px; top: -2px; height: 1px; background: #4d4d4d; pointer-events: none; }
      .hud-tc { top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
      .hud-tc > * { pointer-events: auto; }
      .turnchip { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 2px solid #888; border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
      .turnchip .badge { background: var(--ok); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
      .turnchip .badge:empty { display: none; }
      /* nome do turno: numa linha (computador e tablet) ou em duas (celular: TURN em cima, o nome embaixo) */
      #turnText .t-short { display: none; }
      #turnText .t-short .tl { display: block; font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); line-height: 1.1; }
      #turnText .t-short .tn { display: block; font-size: 12px; font-weight: 700; line-height: 1.2; }
      #turnText .t-short:empty { display: none; }
      .phases { display: flex; gap: 4px; }
      .ph { display: inline-flex; align-items: center; justify-content: center; line-height: 1; font-size: 12px; padding: 4px 9px; border-radius: 999px; background: #2a2a2a; color: #b8b8b8; white-space: nowrap; text-align: center; }
      .ph.on { background: #4a4a4a; color: #fff; outline: 1px solid #e0e0e0; font-weight: 700; }
      .hud-tr { top: 10px; right: 10px; width: 200px; }
      .score { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 5px 8px; font-size: 13px; }
      .score > * { cursor: pointer; }
      .score .res { color: #fff; } /* números em branco */
      .score .res svg { color: #8fdcff; } /* cristal azul */
      .score .res .tri svg { color: #ffd84a; } /* tridente amarelo */
      .score .pts { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 34px; padding: 0 6px; font-weight: 900; font-size: 15px; color: #7be26a; background: #0a2a1a; border: 1.5px solid #2f7a2a; border-radius: 8px; font-variant-numeric: tabular-nums; }
      .score .pts.half { color: #ff9a8a; background: #33150f; border-color: #8a3a2a; }
      .score .pts small { font-size: 9px; font-weight: 700; }
      .score .dot { position: relative; }
      .score .dot.q::after { content: ""; position: absolute; left: -1px; top: -7px; width: 12px; height: 7px; background: #ffd23f; clip-path: polygon(0 100%, 0 20%, 25% 55%, 50% 0, 75% 55%, 100% 20%, 100% 100%); }
      #scorepop { position: fixed; right: 6px; top: 86px; z-index: 40; width: 232px; background: #0e2c50; color: #eaf4ff; border: 2px solid; border-radius: 12px; padding: 8px 10px; font-size: 12px; box-shadow: 0 8px 24px #0009; }
      #scorepop h3 { margin: 0 0 6px; font-size: 14px; }
      #scorepop table { width: 100%; border-collapse: collapse; }
      #scorepop td { padding: 2px 0; border-bottom: 1px dashed #2c5a8c; }
      #scorepop td:last-child { text-align: right; font-weight: 800; }
      #scorepop tr.half td { color: #ff9a8a; }
      #scorepop tr.tot td { border: 0; color: #7be26a; font-size: 14px; padding-top: 4px; }
      #scorepop p { margin: 6px 0 0; color: #9fbad6; font-size: 11px; line-height: 1.4; }
      .score .res { display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
      .score .res span { display: inline-flex; align-items: center; gap: 3px; }
      .score .who { display: flex; flex-direction: column; line-height: 1.15; }
      .score .who small { color: var(--muted); font-size: 11px; display: flex; gap: 3px; align-items: center; margin-top: 2px; }
      .score .turn { color: var(--accent); font-weight: 700; }
      /* divisória curta entre o placar de um time e o do próximo: uma linha fina que não encosta nas bordas */
      .score .sep { display: block; grid-column: 1 / -1; height: 1px; margin: 1px 4px; background: #4f4f4f; border-radius: 1px; pointer-events: none; }
      .pip { width: 9px; height: 9px; border-radius: 2px; border: 1px solid #fff9; display: inline-block; }
      .pip.float { border-radius: 50%; background: transparent !important; }
      .pip.dead { opacity: 0.25; }
      .pip.boat { border-radius: 2px 2px 6px 6px; }
      .pip.aboard { outline: 2px solid #ffd84a; outline-offset: 1px; }

      .hud-bc { left: 50%; transform: translateX(-50%); bottom: 10px; width: min(560px, calc(100% - 12px)); display: flex; flex-direction: column; gap: 6px; align-items: stretch; pointer-events: none; }
      .hud-bc > * { pointer-events: auto; }
      /* um cartão só para Convocações e Dado, numa linha só (4 + 4 retângulos), separados por uma barra */
      .combo { display: flex; align-items: stretch; gap: 8px; }
      .combo section { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
      .combo .vbar { width: 1px; background: #4a4a4a; margin: 2px 0; flex: none; }
      .combo h2 { margin: 0 0 4px; font-size: 11px; }
      .slots, .dicefaces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
      .slot, .face { position: relative; width: 100%; height: 50px; padding: 0; border-radius: 10px; background: var(--panel); border: 1px solid #555; overflow: hidden; }
      .slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
      .slot img { width: 30px; height: 30px; margin: 0; }
      .slot .cost { position: static; font-size: 10px; font-weight: 700; color: var(--accent); display: flex; justify-content: center; align-items: center; gap: 2px; line-height: 1; }
      .slot:disabled { opacity: 1; }
      .slot.on { outline: 2px solid var(--accent); background: var(--btn-on); }
      .face { display: grid; place-items: center; padding-bottom: 8px; }
      .face img { display: block; width: 34px; height: 34px; }
      .face small { position: absolute; right: 4px; bottom: 3px; font-size: 10px; font-weight: 800; color: var(--accent); }
      .face.on { opacity: 1; background: var(--btn-on); outline: 2px solid var(--accent); }
      .combo .cap { display: none; }
      /* cartão de aviso azul: o texto à esquerda e, quando há uma ação a cumprir, o botão ao lado, depois de uma barrinha */
      .actionbar { display: flex; align-items: stretch; gap: 10px; background: color-mix(in srgb, #2f8cff 16%, #0b1726); border: 1px solid #3b9cff; border-radius: 12px; padding: var(--ap) 16px; min-height: 56px; max-height: 30vh; max-height: 30dvh; overflow: auto; font-size: 14px; color: #d6eaff; box-shadow: 0 0 14px #2f8cff33; }
      .actionbar.idle .prompt { text-align: center; white-space: nowrap; }
      .actionbar.idle { box-shadow: none; } /* vez do bot: continua azul, só sem o brilho */
      .actionbar .prompt { flex: 1 1 auto; min-width: 0; align-self: center; margin: 0; font-size: 13px; line-height: 1.35; text-align: left; }
      .actionbar .prompt b { font-weight: 800; color: #fff; }
      /* contagem de ações: a etiqueta verde que ficava na barra do topo agora mora no aviso */
      .actionbar .badge { display: inline-block; margin-right: 6px; padding: 1px 9px; border-radius: 999px; background: var(--ok); border: 1px solid var(--ok-line); color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; vertical-align: 1px; }
      .actionbar #controls { display: flex; flex: none; }
      .actionbar { --ap: 8px; }
      .actionbar #controls { position: relative; align-self: stretch; margin-block: calc(var(--ap) * -1); padding-block: var(--ap); }
      .actionbar #controls:not(:empty) { padding-left: 10px; }
      .actionbar #controls:not(:empty)::before { content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: #3b9cff88; }
      .actionbar .row { display: flex; flex-direction: column; gap: 6px; justify-content: center; margin: 0; }
      .actionbar .row button { min-height: 38px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
      /* o botão que pede uma ação pisca devagar para chamar a atenção */
      .actionbar .row button.primary { animation: callPulse 1.3s ease-in-out infinite; }
      @keyframes callPulse { 0%, 100% { box-shadow: 0 0 0 0 #ffe14d00; } 50% { box-shadow: 0 0 0 4px #ffe14d99, 0 0 14px #ffe14d88; } }
      @media (prefers-reduced-motion: reduce) { .actionbar .row button.primary { animation: none; } }
      .logpanel { top: 10px; left: 70px; width: min(290px, calc(100% - 80px)); max-height: 40%; overflow: auto; font-size: 12px; line-height: 1.4; }
      .logpanel div { padding: 3px 0; border-bottom: 1px solid #333; color: #cfcfcf; }
      #chooser { position: absolute; z-index: 6; background: var(--glass); border: 1px solid var(--accent); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
      button.dice-help { display: inline-grid; place-items: center; vertical-align: -3px; margin-left: 5px; width: 22px; height: 22px; min-height: 0; padding: 0; border-radius: 50%; border: 1px solid #666; background: transparent; color: #cfcfcf; cursor: pointer; }
      button.dice-help:hover, button.dice-help.open { background: var(--btn-on); color: #fff; border-color: var(--accent); }
      #pop { position: absolute; z-index: 7; width: 270px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; padding: 10px 12px; background: #1a1a1a; border: 1px solid #777; border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5); font-size: 13px; line-height: 1.4; text-align: left; }
      #pop p { margin: 6px 0 0; }
      #pop .pop-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
      #pop .pop-head img { width: 34px; height: 34px; }
      #pop .pop-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
      #pop .pop-state { color: #b8b8b8; }
      #pop .pop-state.ok { color: #7fe08c; }
      #pop button.primary { width: 100%; margin-top: 10px; min-height: 44px; }
      /* ícones sempre na cor natural: só o contorno e o custo dizem se dá para usar agora */
      .slot.off { opacity: 1; }
      .slot.off .cost { color: #8f8f8f; }
      .slot:not(.off) { border-color: #d4b53a; }
      /* balão de quadrinhos: as opções saem da casa tocada, com a pontinha apontando para ela */
      #chooser.icons { flex-direction: row; gap: 8px; padding: 8px 10px; background: #fffdf2; border: 3px solid #1a1a1a; border-radius: 18px; box-shadow: 0 4px 0 #1a1a1a, 0 10px 20px rgba(0, 0, 0, 0.35); transform: translate(-50%, calc(-100% - 16px)); animation: bubble 0.16s ease-out; }
      #chooser.icons::after { content: ''; position: absolute; left: 50%; bottom: -13px; width: 18px; height: 18px; background: #fffdf2; border-right: 3px solid #1a1a1a; border-bottom: 3px solid #1a1a1a; transform: translateX(-50%) rotate(45deg); }
      #chooser.icons button { position: relative; z-index: 1; width: 54px; height: 54px; padding: 0; justify-content: center; border-radius: 50%; background: var(--accent); border: 3px solid #1a1a1a; color: #1a1a1a; box-shadow: 0 3px 0 #1a1a1a; }
      #chooser.icons button:hover { filter: brightness(1.08); }
      #chooser.icons button:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a1a1a; }
      #chooser.icons button svg { width: 26px; height: 26px; stroke-width: 2.6; }
      @keyframes bubble { from { opacity: 0; transform: translate(-50%, calc(-100% - 6px)) scale(0.85); } }
      .phases button.dice-help { align-self: center; margin-left: 2px; }
      .gest-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      .gest-list li { display: flex; align-items: center; gap: 14px; }
      .gest-list li span { display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.35; }
      .gest-list li b { font-size: 15px; }
      .gest-art { flex: 0 0 auto; width: 108px; height: auto; border-radius: 13px; }
      .modal h4 { margin: 12px 0 4px; font-size: 15px; color: var(--accent); }
      .actionbar .builders { align-items: stretch; }
      .bcard { display: flex; align-items: center; gap: 6px; padding: 3px 12px 3px 4px; min-height: 52px; }
      .bcard img { width: 44px; height: 44px; }
      .bcard.off { opacity: 0.5; }
      .key { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; border: 1px solid #fff9; }
      .key.y { background: #ffe21a; } .key.b { background: #35b8ff; } .key.r { background: #ff8a2a; } .key.g { background: #3fd47a; } .key.t { background: #ffc21a; box-shadow: 0 0 6px #ffc21a; }
      #chooser[hidden], [hidden] { display: none !important; }
      #toast { position: absolute; z-index: 4; left: 50%; bottom: 180px; transform: translateX(-50%); max-width: min(520px, 90%); padding: 8px 14px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 14%, #1a1a1a); border: 1px solid var(--warn); color: #ffe9b8; font-size: 13px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.2s; text-align: center; }
      #toast.show { opacity: 1; }
      /* rolagem do dado: um dado grande gira no meio da tela, troca de face e para na criatura sorteada */
      #roll { position: absolute; z-index: 5; left: 50%; top: 42%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 8px; pointer-events: none; }
      #roll[hidden] { display: none; }
      #roll .die { width: 96px; height: 96px; border-radius: 18px; background: linear-gradient(145deg, #fffaf0, #d9cdb4); border: 3px solid #3a2a1a; box-shadow: 0 10px 24px #0008, inset 0 -6px 0 #0002; display: grid; place-items: center; }
      #roll .die img { width: 72px; height: 72px; }
      #roll.spin .die { animation: dieSpin 0.18s linear infinite; }
      #roll.land .die { animation: dieLand 0.35s ease-out; outline: 3px solid var(--accent); }
      #roll b { min-height: 1.2em; padding: 4px 12px; border-radius: 10px; background: #000a; color: #fff; font-size: 16px; opacity: 0; transition: opacity 0.2s; }
      #roll.land b { opacity: 1; }
      @keyframes dieSpin { 0% { transform: rotate(0) translateY(0); } 25% { transform: rotate(14deg) translateY(-10px); } 50% { transform: rotate(0) translateY(0); } 75% { transform: rotate(-14deg) translateY(-10px); } 100% { transform: rotate(0) translateY(0); } }
      @keyframes dieLand { 0% { transform: scale(1.35); } 60% { transform: scale(0.92); } 100% { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #roll.spin .die, #roll.land .die { animation: none; } }

      /* ---------- tela inicial ---------- */
      .home { position: absolute; inset: 0; z-index: 5; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px; background: linear-gradient(180deg, rgba(18, 18, 18, 0) 0%, rgba(18, 18, 18, 0.5) 100%); pointer-events: none; }
      .home > * { flex: none; pointer-events: auto; }
      .home > .logo { margin-top: auto; }
      /* título: letras de inscrição de templo (Cinzel) em azul-marinho, com contorno de espuma para ler sobre o mar */
      .logo { margin: 0; text-align: center; line-height: 1; pointer-events: none !important; filter: drop-shadow(0 3px 0 #04122b) drop-shadow(0 0 12px rgba(143, 230, 255, 0.45)) drop-shadow(0 8px 12px rgba(0, 0, 0, 0.35)); }
      /* o contorno fica numa cópia branca ATRÁS das letras (não por cima), assim o azul aparece inteiro */
      .logo span { display: block; position: relative; isolation: isolate; }

      /* ---------- barra inferior integrada: menu, turno, fases, placar, convocações e dado, grudados embaixo ---------- */

        .dock .combo h2 { margin: 0; white-space: nowrap; font-size: 12px; }
        .dock .slots, .dock .dicefaces { width: auto; max-width: none; grid-template-columns: repeat(4, 56px); gap: 6px; }
        .slot, .face { height: 46px; }
      }
      /* menu: no celular a lista abre abaixo do ☰; no desktop os ícones ficam abertos na barra do topo e o ☰ abre uma lista de ações */
      .toolcell { display: none; }
      .menudrop { display: none; }
      @media (min-width: 761px) {
        .toolcell { display: flex; flex-direction: row; align-items: center; justify-content: center; padding: 0 8px; }
        .toolcell #tools { position: static; display: flex; flex-direction: row; align-items: center; gap: 2px; padding: 0; background: none; border: 0; box-shadow: none; }
        .toolcell #tools .tools-list { display: contents; }
        .toolcell #tools button { width: 34px; height: 34px; }
        .toolcell #tools button + button::before { display: none; }
        .toolcell #tools .mobile-only { display: none !important; }
        .toolcell #tools #camera { display: flex !important; flex-direction: row; gap: 2px; margin: 0; padding: 0; border: 0; }
        .menucell { position: relative; }
        .menudrop { display: grid; gap: 4px; position: absolute; left: 4px; top: calc(100% + 6px); z-index: 8; min-width: 230px; padding: 6px; background: var(--glass); border: 1px solid #555; border-radius: 10px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4); }
        .menudrop[hidden] { display: none; }
        .menudrop button { justify-content: flex-start; white-space: nowrap; min-height: 40px; background: transparent; border-color: transparent; }
        .menudrop button:hover:not(:disabled) { background: var(--card2); }
      }
      /* tablet (761 a 1099 px): barra do topo compacta, para o avatar, os ícones e o placar caberem lado a lado sem se sobrepor */
      @media (min-width: 761px) and (max-width: 1099px) {
        .scorecell h2 > span { display: none; }
        .scorecell { gap: 2px; padding: 5px 4px; }
        .topbar .score { font-size: 11px; gap: 0 2px; }
        .topbar .score .sep { margin: 4px 5px; }
        .topbar .score .pts { min-width: 26px; font-size: 12px; }
        .toolcell { padding: 0 2px; }
        .toolcell #tools { gap: 0; }
        .toolcell #tools button { width: 28px; height: 30px; }
        .toolcell #tools #camera { gap: 0; }
        .topbar .turncell { padding-left: 6px; padding-right: 2px; }
        /* ícones e placar nunca encolhem (não se sobrepõem): quem cede espaço é o nome do jogador, que ganha reticências só se faltar lugar */
        .topbar .menucell, .topbar .toolcell, .topbar .scorecell { flex: 0 0 auto; }
        .topbar .turncell { flex: 1 1 0; min-width: 0; }
        .topbar .turnchip { gap: 4px; font-size: 11px; flex-wrap: nowrap; min-width: 0; width: 100%; }
        .topbar .turnchip #turnDot { flex: 0 0 auto; }
        .topbar .turnchip b { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
      }
      @media (max-width: 760px) {
        #turnText .t-long { display: none; }
        #turnText .t-short { display: block; }
        #turnText { text-align: left; min-width: 0; }
        #turnText .t-short .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .topbar .turncell { align-items: center; padding-left: 8px; padding-right: 4px; min-width: 0; }
        .topbar .turnchip { flex-wrap: nowrap; justify-content: flex-start; align-items: center; gap: 8px; min-width: 0; }
        .topbar .turnchip #turnDot { flex: 0 0 auto; }
        .langsw { flex-direction: column; gap: 2px; }
        .langsw button { min-width: 40px; min-height: 36px; padding: 0 4px; }
        .hud-tl button { width: 40px; height: 40px; }
        .zoomonly { display: none; } /* no celular o zoom é com os dois dedos */
        .hud-tc { left: 74px; right: 128px; transform: none; align-items: center; } /* mesma folga (14px) entre o menu e o placar */
        .phases { flex-wrap: wrap; justify-content: center; }
        .turnchip { padding: 3px 10px; font-size: 13px; white-space: normal; text-align: center; }
        .turnchip .badge { white-space: nowrap; flex-shrink: 0; }
        .ph { font-size: 10px; padding: 4px 6px; }
        .phases { gap: 3px; }
        /* placar compacto: só a cor, os cristais e os tridentes (os nomes aparecem no chip de vez) */
        .hud-tr { right: 6px; top: 8px; width: auto; padding: 5px 7px; }
        .hud-tr h2 { font-size: 11px; margin-bottom: 4px; }
        .score { grid-template-columns: auto auto auto; gap: 4px 6px; font-size: 12px; }
        .score .who { display: none; }
        /* avisos em cima, convocações + dado numa fileira só embaixo */
        .hud-bc { width: calc(100% - 12px); gap: 5px; } /* folga externa original: 6 px de cada lado */
        .hud-bc .actionbar { max-height: 30vh; max-height: 30dvh; min-height: 56px; --ap: 6px; padding: var(--ap) 16px; gap: 8px; }
        .actionbar .prompt { font-size: 12px; }
        .hud-card { padding: 5px 7px; }
        .combo { gap: 6px; }
        .combo h2 { font-size: 10px; margin-bottom: 3px; }
        .slots, .dicefaces { gap: 3px; }
        .slot, .face { height: 46px; border-radius: 8px; }
        .slot img { width: 26px; height: 26px; }
        .face img { width: 26px; height: 26px; }
        .slot .cost { font-size: 9px; }
        .actionbar .row button { min-height: 36px; padding: 4px 9px; font-size: 12px; }
        .logpanel { left: 60px; top: 60px; width: min(280px, calc(100% - 70px)); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div id="alarm"></div>

      <div id="hud" hidden>
        <div class="hud hud-tl menu-pop" id="tools" hidden></div>
        <div class="hud logpanel hud-card" id="logpanel" hidden></div>
        <div class="hud hud-bc">
          <div class="actionbar" id="bar"><p class="prompt" id="msg"></p><div id="controls"></div></div>
        </div>
        <div class="hud topbar" id="topbar">
          <div class="drow top">
            <div class="dcell menucell"><button type="button" id="menuBtn" aria-haspopup="true" aria-controls="tools" aria-label="Menu"></button><div class="menudrop" id="menudrop" hidden></div></div>
            <div class="dcell turncell">
          <div class="turnchip" id="turnchip"><span class="dot" id="turnDot"></span><b id="turnText"></b><span class="badge" id="turnBadge"></span></div>
            </div>
            <div class="dcell toolcell" id="toolcell"></div>
            <div class="dcell scorecell"><h2><span data-pt="Placar">Scoreboard</span><button type="button" class="dice-help" id="helpScore" aria-label="How to read the scoreboard" data-pt-aria="Como ler o placar" aria-haspopup="dialog"></button></h2><div class="score" id="score"></div></div>
          </div>
        </div>
        <div class="hud phasebar">
          <div class="phases" id="phases">
            <span class="ph" data-ph="action" data-pt="1 Ação">1 Action</span><span class="ph" data-ph="flood" data-pt="2 Maré">2 Tide</span><span class="ph" data-ph="creatures" data-pt="3 Criaturas">3 Creatures</span><button type="button" class="dice-help" id="helpPhase" aria-label="Rules for this phase" data-pt-aria="Regras desta fase" aria-haspopup="dialog" title="Rules for this phase" data-pt-title="Regras desta fase"></button>
          </div>
          <div class="fleetimer" id="fleeTimer" hidden></div>
        </div>
        <div class="hud dock" id="dock">
          <div class="drow combo">
            <section><h2><span data-pt="Convocações">Summons</span><button type="button" class="dice-help" id="helpSummons" aria-label="How summons work" data-pt-aria="Como funcionam as convocações" aria-haspopup="dialog"></button></h2><div class="slots" id="summons"></div></section>
            <i class="vbar"></i>
            <section><h2><span data-pt="Dado">Die</span><button type="button" class="dice-help" id="helpDice" aria-label="How the die works" data-pt-aria="Como funciona o dado" aria-haspopup="dialog"></button></h2><div class="dicefaces" id="dice"></div><div class="cap" id="diecap"></div></section>
          </div>
        </div>
      </div>
      <div id="toast"></div>
      <div id="roll" aria-live="polite" hidden><div class="die"><img alt="" /></div><b></b></div>
      <div id="chooser" hidden></div>
      <div id="pop" role="dialog" hidden></div>

      <div class="home" id="home"></div>
      <div class="modal" id="modal" hidden></div>
    </div>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
