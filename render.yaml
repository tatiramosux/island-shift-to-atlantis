# Render: site + salas em rede (WebSocket) num único serviço.
# Para criar: Render > New > Blueprint > escolher este repositório.
services:
  - type: web
    name: island-shift-to-atlantis
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
